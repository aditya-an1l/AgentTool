[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttool"
version = "0.2.0"
description = "Terminal-based agentic coding assistant powered by local LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Aditya Anil", email = "aditya.anil.productions@gmail.com"},
]
keywords = ["agent", "llm", "tui", "ollama", "lm-studio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "openai>=1.0.0",
    "ddgs>=6.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
agenttool = "agent:main"

[tool.setuptools]
py-modules = ["agent", "tools"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
